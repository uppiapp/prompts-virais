<!DOCTYPE html>
<html lang="pt-BR" style="font-family:'Inter Tight', system-ui, sans-serif">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ativar conta · Prompts Virais</title>
  <meta name="description" content="Ative sua conta VIP e receba acesso aos prompts virais."/>
  <link rel="stylesheet" href="/assets/styles-CMsMeHHC.css" data-precedence="default"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800;900&family=Outfit:wght@400;800&display=swap" data-precedence="default"/>
  <link rel="stylesheet" href="/enhancements.css"/>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="apple-touch-icon" href="/app-icon-180.png"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
</head>
<body class="bg-[#05060a] text-white min-h-screen selection:bg-[#4f6bf5] selection:text-white">
  <div class="min-h-screen relative flex items-center justify-center px-4 py-14 text-white overflow-hidden" style="background:#05060a">
    <div class="pointer-events-none fixed -top-40 -right-32 w-[600px] h-[600px] rounded-full blur-3xl opacity-25" style="background:radial-gradient(circle,#4f6bf5,transparent 60%)"></div>
    <div class="pointer-events-none fixed -bottom-40 -left-32 w-[600px] h-[600px] rounded-full blur-3xl opacity-20" style="background:radial-gradient(circle,#3733d8,transparent 60%)"></div>

    <div class="relative w-full max-w-[420px] z-10">
      <div class="mb-4 flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-1.5 text-xs font-semibold text-white/50 hover:text-white transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Início
        </a>
        <a href="/admin" class="text-xs font-semibold text-rose-400 hover:underline">
          🔐 Painel Admin
        </a>
      </div>

      <div class="flex flex-col items-center text-center mb-7">
        <img src="/__l5e/assets-v1/5f4ebab9-52d0-4b3e-bd90-2fc6b6f949ba/rv-logo-3d.png" alt="Prompts Virais" class="w-16 h-16 object-contain drop-shadow-[0_0_20px_rgba(79,107,245,0.6)]"/>
        <h1 class="mt-4 text-[26px] font-black leading-tight text-white">
          Ativação VIP<br/>
          <span style="color:#6b86ff">Ative sua conta</span>
        </h1>
        <p class="mt-2 text-[13px] text-white/55 max-w-[320px]">
          Verifique a liberação do seu e-mail cadastrado pelo administrador.
        </p>
      </div>

      <div class="rounded-3xl border border-white/10 p-6 backdrop-blur-xl bg-[#0c0d14]/90 shadow-2xl">
        <!-- Error Alert -->
        <div id="ativar-error-alert" class="p-3 mb-4 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs leading-relaxed" style="display:none;"></div>

        <!-- Step 1: E-mail -->
        <form id="ativar-step1" class="space-y-4">
          <label class="block text-[11px] font-bold uppercase tracking-[0.2em] text-white/45">E-mail de cadastro</label>
          <div class="flex items-center gap-2 rounded-2xl border border-white/10 bg-black/40 px-3.5 h-12 focus-within:border-[#4f6bf5] transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white/40"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            <input id="ativar-email" type="email" required placeholder="seu@email.com" class="flex-1 bg-transparent text-[14px] text-white outline-none placeholder:text-white/25"/>
          </div>
          <button id="ativar-verify-btn" type="submit" class="w-full h-12 rounded-full font-black text-[14px] flex items-center justify-center gap-2 text-white active:scale-[0.98] transition shadow-[0_10px_25px_-8px_rgba(79,107,245,0.6)]" style="background:linear-gradient(135deg,#4f6bf5,#3733d8)">
            <span>Verificar e Ativar</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>

        <!-- Step 2: Activated -->
        <div id="ativar-step2" style="display:none;" class="text-center py-2 space-y-4">
          <div class="mx-auto w-12 h-12 rounded-full grid place-items-center bg-emerald-500/15 border border-emerald-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-400"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div>
            <h2 class="text-[19px] font-black text-white">Conta Ativa e Liberada!</h2>
            <p class="mt-1 text-[13px] text-white/60">Faça login com suas credenciais de aluno.</p>
          </div>
          <a href="/auth" class="w-full h-12 rounded-full font-black text-[14px] flex items-center justify-center gap-2 text-white active:scale-[0.98] transition shadow-[0_10px_25px_-8px_rgba(79,107,245,0.6)]" style="background:linear-gradient(135deg,#4f6bf5,#3733d8)">
            <span>Entrar na Área VIP</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
        </div>
      </div>

      <p class="mt-5 text-center text-[12px] text-white/45">
        Ainda não recebeu seu login? 
        <a href="https://wa.me/5511960510309" target="_blank" rel="noopener noreferrer" class="underline font-semibold text-[#8ea2ff] hover:text-white">Falar com o suporte no WhatsApp</a>
      </p>
    </div>
  </div>

  <script>
    const step1 = document.getElementById('ativar-step1');
    const step2 = document.getElementById('ativar-step2');
    const emailInput = document.getElementById('ativar-email');
    const verifyBtn = document.getElementById('ativar-verify-btn');
    const errAlert = document.getElementById('ativar-error-alert');

    step1.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim().toLowerCase();
      errAlert.style.display = 'none';
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = `<span>Verificando...</span>`;

      try {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        const user = data.users && data.users.find(u => u.email.toLowerCase() === email);
        
        if (user) {
          step1.style.display = 'none';
          step2.style.display = 'block';
        } else {
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = `<span>Verificar e Ativar</span>`;
          errAlert.textContent = '❌ E-mail não encontrado: Este e-mail não foi liberado pelo administrador. Solicite sua liberação via WhatsApp.';
          errAlert.style.display = 'block';
        }
      } catch (err) {
        step1.style.display = 'none';
        step2.style.display = 'block';
      }
    });
  </script>
</body>
</html>
